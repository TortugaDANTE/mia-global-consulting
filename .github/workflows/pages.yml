name: Materializar recursos y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decodificar recursos como archivos reales en main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if ls bundle/assets.b64.part* >/dev/null 2>&1; then
            rm -rf img fonts
            cat bundle/assets.b64.part* | base64 -d | tar xz
            git rm -rq bundle
            git add -A img fonts
            git commit -m "Recursos binarios reales (img/, fonts/)"
            git push origin HEAD:main
          fi
      - name: Decodificar app AR en ar/ (no toca img/ ni fonts/)
        run: |
          if ls ar_bundle/ar.b64.part* >/dev/null 2>&1; then
            rm -rf ar
            cat ar_bundle/ar.b64.part* | base64 -d | tar xz
            git rm -rq ar_bundle
            git add -A ar
            git commit -m "App AR: archivos binarios reales (ar/)"
            git push origin HEAD:main
          fi
      - name: Publicar gh-pages
        run: |
          rm -rf .github README.md bundle ar_bundle .git
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Publicar sitio"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
