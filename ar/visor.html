<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIA · Stand virtual (sin cámara)</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>body{margin:0;font-family:system-ui}#panel{position:fixed;left:8px;right:8px;bottom:8px;z-index:25;background:#fff;border:3px solid #1F1F1F;border-radius:10px;padding:14px;max-height:55vh;overflow:auto;display:none}#panel img{width:100%}.btn,button{font:700 15px system-ui;border:0;border-radius:8px;padding:10px 14px;background:#FF914C;color:#1F1F1F;text-decoration:none;display:inline-block}.k{background:#1F1F1F;color:#fff}#top{position:fixed;top:8px;left:8px;z-index:20;display:flex;gap:6px}</style><script>window.ESC_STAND=2.3;
// Cámara orbitable: arrastrar = girar, rueda/pellizco = zoom (PC y móvil)
AFRAME.registerComponent('orbita',{init(){this.t=new THREE.Vector3(0,1.55,-0.3);this.az=0;this.el_=0.12;this.r=1.9;let d=null,pz=null;const c=this.el.sceneEl;
 const down=e=>{d={x:e.clientX,y:e.clientY};},move=e=>{if(!d)return;this.az-=(e.clientX-d.x)*.005;this.el_=Math.max(-.4,Math.min(.6,this.el_+(e.clientY-d.y)*.004));d={x:e.clientX,y:e.clientY};},up=()=>d=null;
 addEventListener('pointerdown',down);addEventListener('pointermove',move);addEventListener('pointerup',up);
 addEventListener('wheel',e=>{this.r=Math.max(.6,Math.min(3.2,this.r+e.deltaY*.002));},{passive:true});
 addEventListener('touchmove',e=>{if(e.touches.length==2){const z=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pz)this.r=Math.max(.6,Math.min(3.2,this.r*(pz/z)));pz=z;d=null;}},{passive:true});
 addEventListener('touchend',()=>pz=null);},
 tick(){this.az=Math.max(-1.2,Math.min(1.2,this.az));const o=this.el.object3D,t=this.t;o.position.set(t.x+this.r*Math.sin(this.az)*Math.cos(this.el_),t.y+this.r*Math.sin(this.el_),t.z+this.r*Math.cos(this.az)*Math.cos(this.el_));o.lookAt(o.position.clone().multiplyScalar(2).sub(t));}});
</script></head><body style="touch-action:none">
<div id="top"><a class="btn k" href="index.html">← RA</a><button onclick="explorar()">Explorar</button><button onclick="document.getElementById('tv').play()">▶ TV</button></div>
<div id="panel"><button class="k" style="float:right" onclick="cerrar()">✕</button><div id="pc"></div></div>
<a-scene background="color:#12181E" vr-mode-ui="enabled:false" renderer="antialias:true">
 <a-assets><video id="tv" playsinline muted loop crossorigin="anonymous"></video></a-assets>
 <a-entity id="cam" camera="fov: 70" orbita position="0 1.5 1.6" cursor="rayOrigin: mouse" raycaster="objects: .clicable; interval: 60"></a-entity>
 <a-plane rotation="-90 0 0" width="3" height="3" color="#2a2f35"></a-plane><a-plane position="0 1.25 -1.51" width="3" height="2.5" color="#e9e9e9"></a-plane><a-plane position="-1.51 1.25 0" rotation="0 90 0" width="3" height="2.5" color="#f2f2f2"></a-plane><a-plane position="1.51 1.25 0" rotation="0 -90 0" width="3" height="2.5" color="#f2f2f2"></a-plane>
 <a-entity scale="0.254 0.254 0.254" position="0 2.05 -1.5"><a-entity id="stand"></a-entity></a-entity>
</a-scene>

<script src="js/stand.js"></script>
<script>const q=s=>document.querySelector(s);construirStand(q('#stand'),abrir);['izq','fondo','der'].forEach((k,i)=>{const P=POSES[i];const e=document.createElement('a-image');e.setAttribute('src',`img/cartel_${k}.jpg`);e.setAttribute('width',1.1);e.setAttribute('height',1.7);const c=document.createElement('a-entity');c.setAttribute('position',P.p.join(' '));c.setAttribute('rotation',`0 ${P.ry} 0`);e.setAttribute('position','0 0.043 -0.01');c.appendChild(e);q('#stand').appendChild(c);});</script>
</body></html>
