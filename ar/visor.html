<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MIA · Stand virtual (sin cámara)</title>
<link rel="stylesheet" href="css/ui.css">
<style>#top{position:fixed;top:8px;left:8px;right:8px;z-index:20;display:flex;gap:6px;flex-wrap:wrap}#top button,#top a{padding:9px 12px;font-size:14px}body{touch-action:none}</style>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script>
// Cámara orbitable: arrastrar = girar, rueda/pellizco = zoom (PC y móvil); irA(i) mira a un muro
AFRAME.registerComponent('orbita',{init(){this.t=new THREE.Vector3(0,1.3,-0.5);this.az=0;this.el_=0.1;this.r=5.2;this.goal=null;let d=null,pz=null,mov=0;
 const down=e=>{d={x:e.clientX,y:e.clientY};mov=0;},move=e=>{if(!d)return;mov+=Math.abs(e.clientX-d.x)+Math.abs(e.clientY-d.y);this.goal=null;this.az-=(e.clientX-d.x)*.005;this.el_=Math.max(-.2,Math.min(.7,this.el_+(e.clientY-d.y)*.004));d={x:e.clientX,y:e.clientY};},up=()=>d=null;
 const cv=()=>this.el.sceneEl.canvas;this.el.sceneEl.addEventListener('loaded',()=>{const c=cv();c.addEventListener('pointerdown',down);window.vistaGeneral=()=>{this.goal={az:0,r:5.2,t:[0,1.3,-0.5]};};addEventListener('pointermove',move);addEventListener('pointerup',up);
 c.addEventListener('wheel',e=>{this.r=Math.max(.8,Math.min(6,this.r+e.deltaY*.002));e.preventDefault();},{passive:false});
 c.addEventListener('touchmove',e=>{if(e.touches.length==2){const z=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pz)this.r=Math.max(.8,Math.min(6,this.r*(pz/z)));pz=z;d=null;}},{passive:true});
 c.addEventListener('touchend',()=>pz=null);});
 window.irA=i=>{this.goal=[{az:0.35,r:2.2,t:[-1.1,1.2,-0.3]},{az:0,r:2.4,t:[0,1.5,-0.5]},{az:-0.35,r:2.2,t:[1.1,1.0,-0.3]}][i];};},
 tick(){const g=this.goal;if(g){this.az+=(g.az-this.az)*.08;this.r+=(g.r-this.r)*.08;this.el_+=(0.05-this.el_)*.08;this.t.lerp(new THREE.Vector3(...g.t),.08);if(Math.abs(g.az-this.az)<.005)this.goal=null;}
  this.az=Math.max(-1.6,Math.min(1.6,this.az));const o=this.el.object3D,t=this.t;
  o.position.set(t.x+this.r*Math.sin(this.az)*Math.cos(this.el_),t.y+this.r*Math.sin(this.el_),t.z+this.r*Math.cos(this.az)*Math.cos(this.el_));o.lookAt(o.position.clone().multiplyScalar(2).sub(t));}});
</script></head><body>
<div id="top"><a class="btn k" href="index.html">← Cámara AR</a><button onclick="vistaGeneral()">Vista general</button><button onclick="irA(0)">1 Quiénes somos</button><button onclick="irA(1)">2 Cómo trabajamos</button><button onclick="irA(2)">3 Qué ofrecemos</button><button onclick="verSitio()">Sitio MIA</button></div>
<a id="waFijo" target="_blank" href="https://wa.me/524441749695?text=Hola%2C%20vi%20el%20stand%20virtual%20de%20MIA%20y%20me%20interesa%20conversar">Hablar por WhatsApp</a>
<div id="bar"><button onclick="menuSoluciones()">Soluciones</button><button onclick="diagnostico()">Diagnóstico</button><button class="k" onclick="const v=document.getElementById('tv');v.muted=!v.muted;v.play()">🔈 TV</button><button class="k" onclick="menuContacto()">Contacto</button></div>
<div id="panel"><button class="x k" onclick="cerrar()">✕</button><div id="pc"></div></div>
<video id="tv" crossorigin="anonymous" playsinline webkit-playsinline muted loop autoplay style="display:none"></video>
<a-scene background="color:#1B2128" vr-mode-ui="enabled:false" renderer="antialias:true; colorManagement: true" loading-screen="dotsColor: #FF914C; backgroundColor: #1B2128">
 <a-entity id="cam" camera="fov: 65" orbita cursor="rayOrigin: mouse" raycaster="objects: .clicable, .clicable *; interval: 60"></a-entity>
 <!-- 1 unidad del stand = ancho del ancla (0.60 m); el display (imagen ancla) se muestra aquí en lugar de la cámara -->
 <a-entity position="0 0.9 -0.5" scale="0.6 0.6 0.6"><a-image src="img/display_ancla.jpg" width="1" height="2.667" material="shader: flat"></a-image><a-entity id="stand"></a-entity></a-entity>
</a-scene>
<script src="js/stand.js"></script>
<script>document.fonts.load('800 40px Poppins').then(()=>document.fonts.load('700 40px Poppins')).catch(()=>{}).finally(()=>{construirStand(document.getElementById('stand'));document.getElementById('tv').play().catch(()=>{});});</script>
</body></html>
